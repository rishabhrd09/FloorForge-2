l="#25372f" font-size="2.1" text-anchor="start">detailed here.</text><text x="261.0000" y="181.9000" fill="#25372f" font-size="2.1" text-anchor="start">No cladding anchors or construction joints are designed.</text><text x="261.0000" y="244.0000" fill="#25372f" font-size="2.4" text-anchor="start">SCALE 1:75 AT A3 / CUT +1200 mm</text><text x="261.0000" y="251.0000" fill="#25372f" font-size="2.2" text-anchor="start">Dimensions govern; do not scale from a screen.</text><path d="M 22 259 H 75.33333333333334" stroke="#25372f" stroke-width=".6"/><path d="M 22.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="22.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">0 m</text><path d="M 48.66666666666667 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="48.6667" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">2 m</text><path d="M 75.33333333333334 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="75.3333" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">4 m</text><text x="17.0000" y="279.0000" fill="#8a4933" font-size="2.65" text-anchor="start">PRELIMINARY - ENGINEER TO REVIEW - NOT FOR CONSTRUCTION</text><text x="17.0000" y="286.0000" fill="#25372f" font-size="2.15" text-anchor="start">Reference design screen only. Survey, structure, services, byelaws and professional approval remain outstanding.</text><text x="403.0000" y="283.0000" fill="#25372f" font-size="2.35" text-anchor="end">A-201  |  420 x 297 mm</text></g></svg>