asharray="1.2 .6"/><text x="73.0400" y="73.7100" fill="#25372f" font-size="2.5" text-anchor="middle">3</text><path d="M 250 42 V 256" stroke="#c9d0c7" stroke-width=".2"/><text x="261.0000" y="46.0000" fill="#25372f" font-size="3.8" text-anchor="start">The Verandah House</text><text x="261.0000" y="150.0000" fill="#25372f" font-size="2.7" text-anchor="start">DRAWING NOTES</text><text x="261.0000" y="158.0000" fill="#25372f" font-size="2.25" text-anchor="start">Axes shown for coordination only; they are NOT column</text><text x="261.0000" y="162.3000" fill="#25372f" font-size="2.25" text-anchor="start">locations.</text><text x="261.0000" y="169.1000" fill="#25372f" font-size="2.25" text-anchor="start">No column, beam, slab or footing is sized or certified.</text><text x="261.0000" y="175.9000" fill="#25372f" font-size="2.25" text-anchor="start">Engineer must establish an actual load path and lateral</text><text x="261.0000" y="180.2000" fill="#25372f" font-size="2.25" text-anchor="start">system.</text><text x="261.0000" y="187.0000" fill="#25372f" font-size="2.25" text-anchor="start">No soil-bearing capacity is inferred from a soil</text><text x="261.0000" y="191.3000" fill="#25372f" font-size="2.25" text-anchor="start">photograph.</text><text x="261.0000" y="244.0000" fill="#25372f" font-size="2.4" text-anchor="start">SCALE 1:100 AT A3 / CUT +1200 mm</text><text x="261.0000" y="251.0000" fill="#25372f" font-size="2.2" text-anchor="start">Dimensions govern; do not scale from a screen.</text><path d="M 22 259 H 62.0" stroke="#25372f" stroke-width=".6"/><path d="M 22.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="22.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">0 m</text><path d="M 42.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="42.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">2 m</text><path d="M 62.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="62.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">4 m</text><text x="17.0000" y="279.0000" fill="#8a4933" font-size="2.65" text-anchor="start">PRELIMINARY - ENGINEER TO REVIEW - NOT FOR CONSTRUCTION</text><text x="17.0000" y="286.0000" fill="#25372f" font-size="2.15" text-anchor="start">Reference design screen only. Survey, structure, services, byelaws and professional approval remain outstanding.</text><text x="403.0000" y="283.0000" fill="#25372f" font-size="2.35" text-anchor="end">S-001  |  420 x 297 mm</text></g></svg>