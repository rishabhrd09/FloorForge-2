een.</text><path d="M 22 259 H 102.0" stroke="#25372f" stroke-width=".6"/><path d="M 22.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="22.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">0 m</text><path d="M 62.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="62.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">2 m</text><path d="M 102.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="102.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">4 m</text><text x="17.0000" y="279.0000" fill="#8a4933" font-size="2.65" text-anchor="start">PRELIMINARY - ENGINEER TO REVIEW - NOT FOR CONSTRUCTION</text><text x="17.0000" y="286.0000" fill="#25372f" font-size="2.15" text-anchor="start">Reference design screen only. Survey, structure, services, byelaws and professional approval remain outstanding.</text><text x="403.0000" y="283.0000" fill="#25372f" font-size="2.35" text-anchor="end">A-202  |  420 x 297 mm</text></g></svg>