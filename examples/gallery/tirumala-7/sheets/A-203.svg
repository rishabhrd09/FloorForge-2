>Wall and opening heights derive from the building model; levels</text><text x="261.0000" y="160.9000" fill="#25372f" font-size="2.1" text-anchor="start">in metres above NGL.</text><text x="261.0000" y="166.6000" fill="#25372f" font-size="2.1" text-anchor="start">This elevation records the primary wall plane.</text><text x="261.0000" y="172.3000" fill="#25372f" font-size="2.1" text-anchor="start">Decorative facade accessories are coordinated in 3D, not fully</text><text x="261.0000" y="176.2000" fill="#25372f" font-size="2.1" text-anchor="start">detailed here.</text><text x="261.0000" y="181.9000" fill="#25372f" font-size="2.1" text-anchor="start">No cladding anchors or construction joints are designed.</text><text x="261.0000" y="244.0000" fill="#25372f" font-size="2.4" text-anchor="start">SCALE 1:100 AT A3 / CUT +1200 mm</text><text x="261.0000" y="251.0000" fill="#25372f" font-size="2.2" text-anchor="start">Dimensions govern; do not scale from a screen.</text><path d="M 22 259 H 62.0" stroke="#25372f" stroke-width=".6"/><path d="M 22.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="22.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">0 m</text><path d="M 42.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="42.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">2 m</text><path d="M 62.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="62.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">4 m</text><text x="17.0000" y="279.0000" fill="#8a4933" font-size="2.65" text-anchor="start">PRELIMINARY - ENGINEER TO REVIEW - NOT FOR CONSTRUCTION</text><text x="17.0000" y="286.0000" fill="#25372f" font-size="2.15" text-anchor="start">Reference design screen only. Survey, structure, services, byelaws and professional approval remain outstanding.</text><text x="403.0000" y="283.0000" fill="#25372f" font-size="2.35" text-anchor="end">A-203  |  420 x 297 mm</text></g></svg>