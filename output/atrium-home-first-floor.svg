<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.9 -5.15 61.2 50" class="dimensioned-house" role="img" aria-label="First floor · master suite, two private rooms and terraces"><title>First floor · master suite, two private rooms and terraces</title><style>
.dimensioned-house {width:100%;height:auto;display:block;--paper:var(--background,#fff);--ink:var(--foreground,#20302f);--rule:var(--muted-foreground,#637270);--detail:color-mix(in srgb,var(--ink) 40%,var(--paper));--tint:color-mix(in srgb,var(--ink) 5%,var(--paper));--kfill:color-mix(in srgb,var(--viz-series-2,#c48a35) 14%,var(--paper));--ifill:color-mix(in srgb,var(--viz-series-1,#3b8b98) 9%,var(--paper));font-family:Arial,sans-serif}
.dimensioned-house .wall{stroke:var(--ink);stroke-width:.28;fill:none;stroke-linecap:square}
.dimensioned-house .thin,.dimensioned-house .leaf,.dimensioned-house .opening,.dimensioned-house .dim{stroke:var(--detail);stroke-width:.075;fill:none}
.dimensioned-house .leaf{stroke:var(--rule);stroke-width:.085}
.dimensioned-house .opening{stroke-dasharray:.32 .23}
.dimensioned-house .dim{stroke:var(--rule);stroke-width:.052}
.dimensioned-house .object{fill:var(--tint);stroke:var(--detail);stroke-width:.075}
.dimensioned-house text{fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dimensioned-house .name{font-size:1.01px;font-weight:500}
.dimensioned-house .val,.dimensioned-house .dt,.dimensioned-house .sm{font-size:.84px}
.dimensioned-house .road{font-size:.92px;letter-spacing:.055px}
.dimensioned-house .keymark{display:none;font-size:2.15px}
.dimensioned-house .dt,.dimensioned-house .sm,.dimensioned-house .val{fill:var(--rule)}

.dimensioned-house .guard{stroke:var(--rule);stroke-width:.14;fill:none}
.dimensioned-house .oh{stroke:var(--viz-series-1,#447f81);stroke-width:.15;fill:none;stroke-dasharray:.48 .26}
.dimensioned-house .light{fill:color-mix(in srgb,var(--viz-series-1,#447f81) 15%,var(--paper))}
