 above natural</text><text x="261.0000" y="160.9000" fill="#25372f" font-size="2.1" text-anchor="start">ground level (NGL).</text><text x="261.0000" y="166.6000" fill="#25372f" font-size="2.1" text-anchor="start">Room sizes are clear sizes between finished wall faces; * marks</text><text x="261.0000" y="170.5000" fill="#25372f" font-size="2.1" text-anchor="start">the principal rectangle of an L-shaped room.</text><text x="261.0000" y="176.2000" fill="#25372f" font-size="2.1" text-anchor="start">Dimension chains: openings, walls, overall. Tags: D door, SD</text><text x="261.0000" y="180.1000" fill="#25372f" font-size="2.1" text-anchor="start">sliding door, O cased opening, W window, V ventilator (see</text><text x="261.0000" y="184.0000" fill="#25372f" font-size="2.1" text-anchor="start">A-601).</text><text x="261.0000" y="189.7000" fill="#25372f" font-size="2.1" text-anchor="start">Door leaves are drawn in the room they open into. Windows above</text><text x="261.0000" y="193.6000" fill="#25372f" font-size="2.1" text-anchor="start">the +1.2 m cut are dashed; furniture is schematic at true scale.</text><text x="261.0000" y="199.3000" fill="#25372f" font-size="2.1" text-anchor="start">Grid bubbles are coordination axes only, not column positions.</text><text x="261.0000" y="203.2000" fill="#25372f" font-size="2.1" text-anchor="start">No certified IS 962 or local-code compliance is claimed.</text><text x="261.0000" y="244.0000" fill="#25372f" font-size="2.4" text-anchor="start">SCALE 1:100 AT A3 / CUT +1200 mm</text><text x="261.0000" y="251.0000" fill="#25372f" font-size="2.2" text-anchor="start">Dimensions govern; do not scale from a screen.</text><path d="M 22 259 H 62.0" stroke="#25372f" stroke-width=".6"/><path d="M 22.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="22.0000" y="264.0000" fill="#25372f" font-size="1.9" text-anchor="middle">0 m</text><path d="M 42.0 258 V 260" stroke="#25372f" stroke-width=".2"/><text x="42.0000" y="264.0000" fill="#25372f