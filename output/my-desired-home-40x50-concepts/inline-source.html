    const aliases={ICU:'HOME CARE / ICU',CG:'Caregiver',DR:'Drawing',L:'Living + dining',V:'Veranda',K:'L kitchen',M:'Master',P:'Parking',E:'Entry porch',S:'Stair',SP:'Spine',CL:'Lobby',MB:'Bath',WC:'WC',G:'Planting',NP:'North path',U:'Gallery',US:'Stair',B2:'Bedroom 2',B3:'Upper master',B3B:'Ensuite',BAL:'Balcony',UB:'Bath',UP:'Gallery',UL:'Landing',VOID:'Void',T:'East terrace',NT:'North terrace',RT:'Roof',O:'Office'};
    for(const r of fl.rooms){
      const small=r.size[0]*s<62||r.size[1]*s<40;
      const line1=compact||small?r.id:(aliases[r.id]||r.name.replace(/ ·.*/,''));
      const lx=xx(r.at[0]),ly=yy(r.at[1]);
      const text=txt(labelGroup,lx,ly-(!compact&&!small?4:-4),line1,{class:'room-name'});
      if(!compact&&!small)txt(labelGroup,lx,ly+12,r.rectangular===false?`${fmt(r.area)} sq ft`:`${ft(r.size[0])} × ${ft(r.size[1])}`,{class:'secondary'});
      const hover=$('title',{},text);hover.textContent=`${r.id} · ${r.name}: ${ft(r.size[0])} × ${ft(r.size[1])}`;
    }
    if(!compact){const bar=5*s;const y=yy(o.plot[1])+39;$('line',{x1:xx(0),y1:y,x2:xx(5),y2:y,stroke:'var(--foreground)','stroke-width':3},svg);txt(svg,xx(5)+7,y+4,'5 ft',{'text-anchor':'start'});}
    roomSelect.replaceChildren();for(const r of fl.rooms){const n=document.createElement('option');n.value=r.id;n.textContent=`${r.id} · ${r.name}`;roomSelect.appendChild(n);}
    if(!fl.rooms.some(r=>r.id===state.room))state.room=fl.rooms.find(r=>r.id==='ICU'||r.id==='B3')?.id||fl.rooms[0].id;
    roomSelect.value=state.room;details();
  }
  function drawSite(w){
    root.querySelector('#dh-caption').textContent='Shared exterior reference · Tirumala · schematic context, not to scale';
    const h=w<500?460:430,svg=$('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'dh-plan',role:'img','aria-label':'North colony garden across 12 metre road; east basketball court across 9 metre road; both outside the 40 by 50 foot plot.'},plot);
    const x=32,pw=(w-64)*.62,py=170,ph=210,roadX=x+pw+12,rw=32,cx=roadX+rw+10,cw=w-cx-18;
    $('rect',{x,y:18,width:pw,height:77,fill:'var(--viz-series-4)','fill-opacity':'.16'},svg);
    txt(svg,x+pw/2,45,'NORTH COLONY GARDEN');txt(svg,x+pw/2,65,'Lawn · palms · pergola',{class:'secondary'});
    $('rect',{x,y:108,width:pw,height:43,fill:'var(--muted)'},svg);txt(svg,x+pw/2,134,'North road · 12 m');
    $('rect',{x,y:py,width:pw,height:ph,fill:'var(--background)',stroke:'var(--foreground)','stroke-width':1.5},svg);
    txt(svg,x+pw/2,py+75,'NEW HOME');txt(svg,x+pw/2,py+97,'50′ E–W × 40′ N–S');txt(svg,x+pw/2,py+119,'2,000 sq ft private plot');
    txt(svg,x+pw/2,py+165,'East entry →');
    $('rect',{x:roadX,y:108,width:rw,height:ph+62,fill:'var(--muted)'},svg);
    txt(svg,roadX+rw/2,py+ph/2,'East road · 9 m',{transform:`rotate(-90 ${roadX+rw/2} ${py+ph/2})`});
    $('rect',{x:cx,y:py,width:cw,height:ph,fill:'var(--viz-series-3)','fill-opacity':'.12',stroke:'var(--border)','stroke-width':1},svg);
    txt(svg,cx+cw/2,py+ph/2,'BASKETBALL COURT',{transform:`rotate(-90 ${cx+cw/2} ${py+ph/2})`});
    txt(svg,x+pw/2,410,'N ↑ · Exterior land is outside the plot',{class:'secondary'});
  }
  option.addEventListener('change',()=>{state.option=option.value;state.room='ICU';redraw();save();});
  floor.addEventListener('change',()=>{state.floor=floor.value;redraw();save();});
  roomSelect.addEventListener('change',()=>{state.room=roomSelect.value;details();save();});
  furniture.addEventListener('change',()=>{state.furniture=furniture.checked;redraw();save();});
  load(window.openai?.widgetState);redraw();
  let lastWidth=0;new ResizeObserver(()=>{const w=plot.clientWidth;if(w!==lastWidth){lastWidth=w;redraw();}}).observe(plot);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){load(event.detail.globals.widgetState);redraw();}});
})();
</script>
