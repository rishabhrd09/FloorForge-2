<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.9 -5.15 61.2 50" class="dimensioned-house" role="img" aria-label="First floor · bedrooms, study and two terraces"><title>First floor · bedrooms, study and two terraces</title><style>
.dimensioned-house {width:100%;height:auto;display:block;--paper:var(--background,#fff);--ink:var(--foreground,#20302f);--rule:var(--muted-foreground,#637270);--detail:color-mix(in srgb,var(--ink) 40%,var(--paper));--tint:color-mix(in srgb,var(--ink) 5%,var(--paper));--kfill:color-mix(in srgb,var(--viz-series-2,#c48a35) 14%,var(--paper));--ifill:color-mix(in srgb,var(--viz-series-1,#3b8b98) 9%,var(--paper));font-family:Arial,sans-serif}
.dimensioned-house .wall{stroke:var(--ink);stroke-width:.28;fill:none;stroke-linecap:square}
.dimensioned-house .thin,.dimensioned-house .leaf,.dimensioned-house .opening,.dimensioned-house .dim{stroke:var(--detail);stroke-width:.075;fill:none}
.dimensioned-house .leaf{stroke:var(--rule);stroke-width:.085}
