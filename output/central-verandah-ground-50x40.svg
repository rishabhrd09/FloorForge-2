<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.9 -5.15 61.2 50" role="img" aria-labelledby="house-title house-desc" class="dimensioned-house"><title id="house-title">Central verandah and two ICU entrances · 50 by 40 foot north-east corner house</title><desc id="house-desc">North is up. The east car porch measures eleven by twenty feet. The south utility strip measures sixteen by six feet. It has a seven by six foot store on the west and a nine by six foot wash area on the east, both entered from the kitchen. A two-foot gap remains beside the ground-floor stair. The rectangular drawing room has a straight east wall aligned with the west wall of the sixteen-foot-square ICU along a ten-foot shared wall. The ICU north wall aligns with the drawing room north wall, two feet from the north boundary. The central verandah occupies the full sixteen by eight foot strip between the ICU and dining hall. Enter the central verandah from the east, with six-foot double doors straight ahead into the living hall, a six-foot sliding opening to the ICU on the right, and a separate six-foot sliding opening between the hall and the ICU. A four by eight foot open-to-sky court at the bathroom junction has one high-level openable window from each attached bath. A two by fourteen foot west gully connects the court to the master bedroom through a service door. The 2-foot north gully and living hall have separate caregiver entrances. A solid partition separates caregiver and drawing rooms. The caregiver and master bathrooms open only from their bedrooms. The separate living hall has lounge seating. The 12 by 7 foot dining hall south of the ICU has a four-place table, a wall bench, and a short prep platform at the kitchen end.</desc><style>
.dimensioned-house {width:100%;height:auto;display:block;--paper:var(--background,#fff);--ink:var(--foreground,#20302f);--rule:var(--muted-foreground,#637270);--detail:color-mix(in srgb,var(--ink) 40%,var(--paper));--tint:color-mix(in srgb,var(--ink) 5%,var(--paper));--kfill:color-mix(in srgb,var(--viz-series-2,#c48a35) 14%,var(--paper));--ifill:color-mix(in srgb,var(--viz-series-1,#3b8b98) 9%,var(--paper));font-family:Arial,sans-serif}
.dimensioned-house .wall{stroke:var(--ink);stroke-width:.28;fill:none;stroke-linecap:square}
.dimensioned-house .thin,.dimensioned-house .leaf,.dimensioned-house .opening,.dimensioned-house .dim{stroke:var(--detail);stroke-width:.075;fill:none}
.dimensioned-house .leaf{stroke:var(--rule);stroke-width:.085}
.dimensioned-house .opening{stroke-dasharray:.32 .23}
.dimensioned-house .dim{stroke:var(--rule);stroke-width:.052}
.dimensioned-house .object{fill:var(--tint);stroke:var(--detail);stroke-width:.075}
.dimensioned-house text{fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dimensioned-house .name{font-size:1.01px;font-weight:500}
.dimensioned-house .val,.dimensioned-house .dt,.dimensioned-house .sm{font-size:.84px}
