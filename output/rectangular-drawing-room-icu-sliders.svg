<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.9 -5.15 61.2 50" role="img" aria-labelledby="house-title house-desc" class="dimensioned-house"><title id="house-title">Rectangular drawing room and centred ICU sliders · 50 by 40 foot north-east corner house</title><desc id="house-desc">North is up. The east car porch measures eleven by twenty feet. The south utility strip measures sixteen by six feet. It has a seven by six foot store on the west and a nine by six foot wash area on the east, both entered from the kitchen. A two-foot gap remains beside the ground-floor stair. The ICU measures fifteen feet east to west and seventeen feet north to south. The north-facing six-foot double doorway lies on the same line as the ICU north wall, between the drawing room and ICU. Both three-foot leaves swing south into the living hall. A five-and-a-half by seven foot covered approach joins the main verandah to the doorway. The rectangular 9.5 by 14 foot drawing room has two east-facing verandah windows and an inward-opening east door from the living hall, south of the main double doors. The ICU has a centred seven-foot glass sliding entrance and independent outer timber sliders on the same north opening, two large east windows, a centred bed, a west sliding entry nearer the stairs, and a solid south wall. The attached master bath occupies the former light court and opens only from the bedroom. The bedroom opens from the hall through its east wall. A high window from the master bath overlooks the west gully. A dedicated exhaust to the roof is proposed for the caregiver bath. The 2-foot north gully and living hall have separate caregiver entrances. A solid partition separates caregiver and drawing rooms. The caregiver and master bathrooms open only from their bedrooms. The separate living hall has lounge seating. The 12 by 7 foot dining hall south of the ICU has a four-place table, a wall bench, and a short prep platform at the kitchen end.</desc><style>
.dimensioned-house {width:100%;height:auto;display:block;--paper:var(--background,#fff);--ink:var(--foreground,#20302f);--rule:var(--muted-foreground,#637270);--detail:color-mix(in srgb,var(--ink) 40%,var(--paper));--tint:color-mix(in srgb,var(--ink) 5%,var(--paper));--kfill:color-mix(in srgb,var(--viz-series-2,#c48a35) 14%,var(--paper));--ifill:color-mix(in srgb,var(--viz-series-1,#3b8b98) 9%,var(--paper));font-family:Arial,sans-serif}
.dimensioned-house .wall{stroke:var(--ink);stroke-width:.28;fill:none;stroke-linecap:square}
.dimensioned-house .thin,.dimensioned-house .leaf,.dimensioned-house .opening,.dimensioned-house .dim{stroke:var(--detail);stroke-width:.075;fill:none}
.dimensioned-house .leaf{stroke:var(--rule);stroke-width:.085}
.dimensioned-house .opening{stroke-dasharray:.32 .23}
.dimensioned-house .dim{stroke:var(--rule);stroke-width:.052}
