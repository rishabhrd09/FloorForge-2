l="#25372f" font-size="1.7333333333333334" text-anchor="middle">FRONT COURT (5.5 FT STANDING / +300 mm)</text><text x="81.3792" y="103.8333" fill="#25372f" font-size="1.6666666666666667" text-anchor="middle">SHALLOW PORCH (3 FT / +300 mm)</text><text x="144.3792" y="108.6333" fill="#25372f" font-size="1.8666666666666667" text-anchor="middle">DRAWING / FAMILY / CARE ROOMS (FLUSH +300 mm — NO STEP)</text><text x="213.4592" y="108.6333" fill="#25372f" font-size="1.7333333333333334" text-anchor="middle">WEST VERANDA (+300 mm)</text><text x="126.0858" y="150.7667" fill="#25372f" font-size="2.2" text-anchor="middle">PROFILE 2 (SOUTH -&gt; NORTH): RAISED FRONT COURT / CARE (+300 mm) VS. LOWER CAR BAY (10.5 x 19 FT AT ±0.000 m)</text><path d="M 36.8058 184.1000 L 215.4725 184.1000" fill="none" stroke="#25372f" stroke-width="0.35"/><polygon points="46.8325,184.1000 160.6325,184.1000 160.6325,168.1000 46.8325,168.1000" fill="#eee9dc" stroke="#25372f" stroke-width="0.3"/><polygon points="160.6325,185.7000 205.3392,185.7000 205.3392,184.1000 160.6325,184.1000" fill="#dcdbd3" stroke="#25372f" stroke-width="0.25"/><polygon points="170.7925,181.7000 197.2058,181.7000 194.8058,166.1000 173.1925,166.1000" fill="#f5f7f6" stroke="#25372f" stroke-width="0.25"/><circle cx="175.0592" cy="181.7000" r="2.4000" fill="none" stroke="#25372f" stroke-width="0.22"/><circle cx="192.9392" cy="181.7000" r="2.4000" fill="none" stroke="#25372f" stroke-width="0.22"/><text x="103.7392" y="164.3667" fill="#25372f" font-size="1.9333333333333333" text-anchor="middle">FRONT COURT / DRAWING / CARE (+300 mm)</text><text x="183.9925" y="163.4333" fill="#25372f" font-size="1.7333333333333334" text-anchor="middle">CAR BAY 10.5 x 19 FT (±0.000 m) / CAR 6.5 x 15.5 FT (2 FT SIDE GAPS)</text><path d="M 46.8325 191.7000 L 46.8325 194.3667" fill="none" stroke="#a8afa4" stroke-width="0.12"/><path d="M 160.6325 191.7000 L 160.6325 194.3667" fill="none" stroke="#a8afa4" stroke-width="0.12"/><path d="M 46.8325 192.7667 L