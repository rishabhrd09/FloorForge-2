name: Native core verification
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python scripts/smoke.py
      - name: Check portable geometry baselines
        run: python -m pytest -q tests/test_custom_plan.py::test_legacy_presets_keep_aesthetic_geometry tests/test_upper_refinement.py::test_upper_refinement_preserves_ground_model_finishes_lighting_and_collision
      - name: Preserve the original samples and planning documents
        run: python scripts/check_custom_preservation.py
      - run: python -m pytest -v --junitxml=evidence/ci-pytest.xml
      - run: python -m floorforge generate --out smoke-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            evidence/ci-pytest.xml
            smoke-output/builds/*/export-checks.json
  custom-journey-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify approval identity and guided editor routing
        run: |
          node tests/design_journey_state.cjs
          node tests/design_journey_recovery.cjs
      - name: Exercise the offline custom-home journey
        run: node scripts/check_custom_journey.mjs
        env:
          FLOORFORGE_PYTHON: python
      - name: Exercise measured imports and reference tracing
        run: node scripts/check_custom_imports.mjs
        env:
          FLOORFORGE_PYTHON: python
      - name: Exercise selected input consumers and Compass controls
        run: node scripts/check_custom_inputs.mjs
        env:
          FLOORFORGE_PYTHON: python
      - name: Exercise an old server with updated app files and same-port recovery
        run: node scripts/check_custom_launch.mjs
        env:
          FLOORFORGE_PYTHON: python
      - name: Exercise guided edits and recovery through the complete Compass journey
        run: node scripts/check_custom_recovery.mjs
        env:
          FLOORFORGE_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-journey-browser-${{ matrix.os }}
          path: |
            evidence/custom-journey/browser-*.png
            evidence/custom-journey/browser-checks.json
            evidence/custom-journey/browser-import-checks.json
            evidence/custom-journey/browser-trace-geometry.json
            evidence/custom-journey/browser-manual-authority.json
            evidence/custom-journey/browser-input-checks.json
            evidence/custom-journey/browser-input-consumers.json
            evidence/custom-journey/browser-text-consumer.json
            evidence/custom-journey/launch-fix/checks.json
            evidence/custom-journey/launch-fix/*.png
            evidence/custom-journey/recovery/**
# This workflow is authored, not evidence that those platforms have passed.
