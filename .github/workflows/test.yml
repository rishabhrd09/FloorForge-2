name: Native core verification
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python scripts/smoke.py
      - run: python -m pytest -q --junitxml=evidence/ci-pytest.xml
      - run: python -m floorforge generate --out smoke-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            evidence/ci-pytest.xml
            smoke-output/builds/*/export-checks.json
# This workflow is authored, not evidence that those platforms have passed.
